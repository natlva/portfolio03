<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Work — Natalie Alvarenga</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,340;9..144,500&family=Inter:wght@400;500&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <nav class="nav">
    <a class="home-diamond" href="index.html" aria-label="Home" title="Home"></a>
    <a href="index.html" style="text-decoration: none; color: inherit;">Natalie Alvarenga</a>
    <div>
      <a href="events.html">Events</a>
      <a href="photo.html">Photo</a>
      <a href="film.html">Film</a>
    </div>
  </nav>
  <main>
    <div class="eyebrow-section">
      <div class="eyebrow">Portrait · Editorial · Product</div>
    </div>
    <section id="photography">
      <div class="section-label reveal">
        <span class="section-num">02</span>
        <span class="section-name">Photography</span>
      </div>
      <div class="section-subtitle reveal">Portrait · Editorial · Product</div>
      <div class="photo-stack reveal">
        <div class="photo-row split">
          <div class="photo-block" data-folder="jessie">
            <img src="imgs/photos/jessie/j1.jpg" alt="Natural Light">
          </div>
          <div class="photo-block" data-folder="lesai">
            <img src="imgs/photos/lesai/sk-40BN.jpg" alt="Lesai">
          </div>
        </div>
        <div class="photo-row split">
          <div class="photo-block" data-folder="gloss">
            <img src="imgs/photos/gloss/DSC00621.jpg" alt="Gloss">
          </div>
          <div class="photo-block" data-folder="kriszara">
            <img src="imgs/photos/kriszara/DSC03411.jpg" alt="Kriszara">
          </div>
        </div>
        <div class="photo-row split">
          <div class="photo-block" data-folder="luna">
            <img src="imgs/photos/luna/luna2fix.jpg" alt="Luna">
          </div>
          <div class="photo-block" data-folder="products">
            <img src="imgs/photos/products/botttle.jpg" alt="Products">
          </div>
        </div>
        <div class="photo-row split">
          <div class="photo-block" data-folder="ksnature">
            <img src="imgs/photos/ksnature/plast.jpg" alt="Ksnature">
          </div>
          <div class="photo-block" data-folder="kris1">
            <img src="imgs/photos/kris1/kris2.jpg" alt="Kris">
          </div>
        </div>
        <div class="photo-row split">
          <div class="photo-block" data-folder="floral">
            <img src="imgs/photos/floral/DSC07151-2.jpg" alt="Artist Series">
          </div>
          <div class="photo-block" data-folder="snow">
            <img src="imgs/photos/snow/snowwwyy.jpg" alt="Snow">
          </div>
        </div>
      </div>

      <div class="gallery-modal" id="photo-gallery-modal">
        <button type="button" class="gallery-close" id="photo-gallery-close" aria-label="Close gallery">&times;</button>
        <div class="gallery-grid" id="photo-gallery-grid"></div>
      </div>
    </section>
  </main>

  <script>
    const folderImages = {
      floral: ['DSC07151-2.jpg', 'IMG_7941.JPG'],
      gloss: ['DSC00621.jpg', 'DSC00622.jpg'],
      jessie: ['j1.jpg', 'DSC00236.jpg', 'DSC00389.jpg', 'DSC00406.jpg', 'DSC00572.jpg', 'DSC01149.jpg', 'DSC01232.jpg', 'DSC01281.jpg', 'DSC01310.jpg'],
      kris1: ['IMG_8415.jpg', 'IMG_8501.jpg', 'IMG_8512-2.jpg', 'kris2.jpg', 'yes14.jpg'],
      kriszara: ['DSC02931.jpg', 'DSC02975.jpg', 'DSC02980.jpg', 'DSC03079.jpg', 'DSC03091.jpg', 'DSC03092.jpg', 'DSC03098.jpg', 'DSC03131.jpg', 'DSC03158.jpg', 'DSC03174.jpg', 'DSC03178.jpg', 'DSC03188.jpg', 'DSC03199.jpg', 'DSC03206.jpg', 'DSC03213.jpg', 'DSC03262.jpg', 'DSC03347.jpg', 'DSC03355-2.jpg', 'DSC03378.jpg', 'DSC03380.jpg', 'DSC03395.jpg', 'DSC03398.jpg', 'DSC03401.jpg', 'DSC03409.jpg', 'DSC03411.jpg', 'DSC03412.jpg', 'DSC03424.jpg', 'DSC03440.jpg', 'DSC03454.jpg', 'DSC03456.jpg', 'DSC03465.jpg', 'DSC03474.jpg', 'DSC03480.jpg', 'DSC03500.jpg', 'DSC03504.jpg', 'DSC03510.jpg'],
      ksnature: ['a23q.jpg', 'eyeball.jpg', 'flyaways final0989.jpg', 'jfgfmi-23hj.jpg', 'plast-1.jpg', 'plast.jpg', 'SARAH U.jpg', 'pp-1.jpg'],
      lesai: ['L-45qwdas.jpg', 'lesai small ls.jpg', 'sk-40BN.jpg', 'small-32BN.jpg', 'small-33HJK.jpg', 'small-35BN.jpg', 'small-42BN.jpg', 'small-6.jpg', 'Untitled-1 copywedw.jpg'],
      luna: ['DSC09003.jpg', 'luna1.jpg', 'luna2fix.jpg', 'okok3lunasmall.jpg'],
      products: ['botttle.jpg', 'IMG_6256.jpg'],
      snow: ['less blue edit-46.jpg', 'less blue edit-48.jpg', 'less blue edit-49.jpg', 'less blue edit-50.jpg', 'less blue edit-51.jpg', 'less blue edit-55.jpg', 'snowwwyy.jpg', 'snowwwyy2.jpg']
    };

    const galleryModal = document.getElementById('photo-gallery-modal');
    const galleryGrid = document.getElementById('photo-gallery-grid');
    const galleryClose = document.getElementById('photo-gallery-close');

    const openGallery = (folder) => {
      const files = folderImages[folder];
      if (!files) return;
      galleryGrid.innerHTML = files
        .map((file) => `<div class="gallery-item"><img src="${encodeURI(`imgs/photos/${folder}/${file}`)}" alt="${folder}" loading="lazy"></div>`)
        .join('');
      galleryModal.classList.add('open');
      document.body.classList.add('gallery-lock');
    };

    const closeGallery = () => {
      galleryModal.classList.remove('open');
      document.body.classList.remove('gallery-lock');
    };

    document.querySelectorAll('.photo-block[data-folder]').forEach((block) => {
      block.addEventListener('click', () => openGallery(block.dataset.folder));
    });

    galleryClose.addEventListener('click', closeGallery);
    galleryModal.addEventListener('click', (event) => {
      if (event.target === galleryModal) closeGallery();
    });
    document.addEventListener('keydown', (event) => {
      if (event.key === 'Escape') closeGallery();
    });
  </script>
</body>
</html>
